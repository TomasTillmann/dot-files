# Fonts
font_family JetBrainsMono Nerd Font Mono
font_size 14.0

# Keep JetBrains Mono's programming ligatures enabled.
disable_ligatures never

# Tab management
map opt+enter new_tab
map opt+t close_tab
map opt+tab next_tab

# Select tabs directly by position (Option+1 through Option+9).
map opt+1 goto_tab 1
map opt+2 goto_tab 2
map opt+3 goto_tab 3
map opt+4 goto_tab 4
map opt+5 goto_tab 5
map opt+6 goto_tab 6
map opt+7 goto_tab 7
map opt+8 goto_tab 8
map opt+9 goto_tab 9

# Disable Kitty's other built-in tab navigation shortcuts.
map ctrl+shift+right no_op
map shift+cmd+] no_op
map ctrl+tab no_op
map ctrl+shift+left no_op
map shift+cmd+[ no_op
map ctrl+shift+tab no_op
map cmd+w close_window
map opt+w close_window

# Layouts: use stack for a single full-screen pane and splits for tiling.
enabled_layouts stack,splits
map opt+m toggle_layout stack
map shift+cmd+1 toggle_layout stack
map shift+cmd+2 goto_layout splits

# Create a pane beside or below the active pane, preserving its directory.
map opt+d combine : goto_layout splits : launch --cwd=current --location=hsplit
map shift+opt+d combine : goto_layout splits : launch --cwd=current --location=vsplit

# Focus terminal windows/panes with Vim directions.
map opt+h neighboring_window left
map opt+j neighboring_window down
map opt+k neighboring_window up
map opt+l neighboring_window right

# Move the active pane with Vim directions.
map shift+opt+h move_window left
map shift+opt+j move_window down
map shift+opt+k move_window up
map shift+opt+l move_window right

# Replace Kitty's interactive resize UI with a Vim-style resize mode (Option+R).
map --new-mode resize opt+r
map --mode resize h resize_window narrower 2
map --mode resize j resize_window shorter 2
map --mode resize k resize_window taller 2
map --mode resize l resize_window wider 2
map --mode resize esc pop_keyboard_mode

# Background transparency (1.0 is fully opaque).
background_opacity 0.90

# Colors are kept separate so the theme is easy to replace later.
include theme.conf

# Saved sessions
map cmd+shift+s save_as_session --save-only --use-foreground-process --match=state:focused_os_window --base-dir ~/.config/kitty/sessions
map cmd+shift+o goto_session ~/.config/kitty/sessions

# Reopen the saved auctions workspace when kitty starts.
startup_session ~/.config/kitty/sessions/auctions.kitty-session
